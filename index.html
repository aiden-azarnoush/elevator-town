<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Elevator Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#233246; --ink-soft:#4b5d75; --sky:#8fd3ff; --sun:#ffc93c; --tomato:#ff6150;
  --mint:#2fbf8f; --grape:#8f6cf0; --paper:#ffffff; --cloud:#eef7ff; --shade:rgba(35,50,70,.22);
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);
  font-family:'Baloo 2',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#view{display:block;width:100%;height:100%;outline:none;touch-action:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* chunky toy button */
.toy{background:var(--paper);border-radius:18px;box-shadow:0 5px 0 var(--shade);transition:transform .08s, box-shadow .08s}
.toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}

/* HUD */
.hud{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-row{display:flex;gap:8px;align-items:center}
.icon-btn{width:52px;height:52px;font-size:26px;display:grid;place-items:center}
.badge{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:4px 14px 4px 5px;box-shadow:0 5px 0 var(--shade)}
.badge .num{min-width:44px;height:44px;border-radius:13px;background:var(--ink);color:var(--sun);font-weight:800;font-size:26px;display:grid;place-items:center;padding-inline:6px;line-height:1}
.badge .nm{font-weight:700;font-size:17px;line-height:1.05;max-width:9.5em}
.badge .nm small{display:block;font-weight:500;font-size:12px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.count{background:var(--paper);border-radius:14px;padding:3px 12px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--shade);font-variant-numeric:tabular-nums}

.mini{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--paper);border-radius:18px;box-shadow:0 5px 0 var(--shade);padding:6px 6px 4px}
.mini h3{margin:0 4px 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.mini h3 b{color:var(--ink)}
#mini{display:block;border-radius:12px;cursor:pointer}

#toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:19px;padding:8px 18px;border-radius:999px;max-width:min(88vw,520px);text-align:center;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.18);pointer-events:none}
#toast.pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}

#hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(255,255,255,.94);border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--shade);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* elevator panel */
#panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 24px));background:#2b3445;color:#fff;border-radius:26px;padding:12px 12px 14px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
#panel.in{animation:slideup .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes slideup{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.ph{display:flex;align-items:center;gap:10px}
.chip{width:34px;height:34px;border-radius:10px;flex:none;border:3px solid rgba(255,255,255,.8)}
.ph .who{flex:1;min-width:0}
.ph .who b{display:block;font-size:19px;line-height:1.1}
.ph .who span{font-size:13px;color:#b9c4d6}
.display{background:#10151f;border-radius:14px;padding:2px 14px;display:flex;align-items:center;gap:8px;min-width:108px;justify-content:center;font-weight:800;font-size:32px;color:var(--sun);line-height:1.25;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 3px #3d4a60}
.display .ar{font-size:22px;width:20px;text-align:center}
.floors{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fbtn{width:74px;height:74px;border-radius:50%;background:#f4f6fa;color:var(--ink);font-weight:800;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 5px 0 #11161f, inset 0 0 0 4px #c9d2df;transition:transform .08s}
.fbtn small{font-size:18px;margin-top:2px}
.fbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #11161f, inset 0 0 0 4px #c9d2df}
.fbtn.here{background:var(--sun);box-shadow:0 5px 0 #11161f, inset 0 0 0 4px #e7a400, 0 0 18px rgba(255,201,60,.7)}
.fbtn.go{background:#bff0dc;box-shadow:0 5px 0 #11161f, inset 0 0 0 4px var(--mint)}
.wait .fbtn,.wait .arrow,.wait .out{opacity:.45;pointer-events:none}
.prow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pb{height:58px;min-width:58px;border-radius:18px;font-size:28px;font-weight:800;display:grid;place-items:center;padding-inline:10px;background:#f4f6fa;color:var(--ink);box-shadow:0 5px 0 #11161f;transition:transform .08s}
.pb:active{transform:translateY(4px);box-shadow:0 1px 0 #11161f}
.pb.bell{background:#ffe38a}
.pb.alarm{background:#ff8b7e}
.pb.alarm.on{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{background:#ff3b2e;color:#fff}}
.pb.out{background:#bff0dc;font-size:20px;gap:4px;grid-auto-flow:column}
.pb.wiggle{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* start screen */
#start{position:absolute;inset:0;overflow:auto;background:
  radial-gradient(ellipse 60% 40% at 12% 18%,rgba(255,255,255,.75) 0 38%,transparent 39%),
  radial-gradient(ellipse 45% 30% at 88% 12%,rgba(255,255,255,.7) 0 38%,transparent 39%),
  linear-gradient(#7cc8ff,#bfe6ff 60%,#d9f5c9 60.2%,#a8e28f);
  display:flex;flex-direction:column;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 32px;gap:16px;touch-action:pan-y}
#start h1{margin:8px 0 0;font-weight:800;font-size:clamp(44px,10vw,84px);line-height:.95;text-align:center;color:#fff;text-shadow:0 4px 0 var(--tomato),0 8px 0 rgba(35,50,70,.25);letter-spacing:.01em;text-wrap:balance}
#start p.sub{margin:0;font-size:clamp(18px,3.6vw,24px);font-weight:700;color:var(--ink)}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;width:min(760px,100%)}
.mapcard{border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 7px 0 var(--shade);transition:transform .1s}
.mapcard:hover{transform:translateY(-3px)}
.mapcard:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shade)}
.mapcard .pic{font-size:64px;line-height:1.1}
.mapcard b{font-size:26px;line-height:1}
.mapcard span{font-size:15px;color:var(--ink-soft);font-weight:500}
.mapcard.hotel{background:#ffe1d6}.mapcard.parking{background:#fff2c2}.mapcard.mall{background:#e4dcff}
.shirts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.85);border-radius:22px;padding:10px 16px;box-shadow:0 5px 0 var(--shade)}
.shirts b{font-size:18px}
.sw{width:46px;height:46px;border-radius:14px;box-shadow:0 4px 0 var(--shade);border:4px solid #fff}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:1px}
.fine{font-size:14px;color:var(--ink-soft);text-align:center;max-width:36em;margin:0}

/* confirm */
.veil{position:absolute;inset:0;background:rgba(35,50,70,.45);display:grid;place-items:center;padding:16px}
.dialog{background:#fff;border-radius:26px;padding:22px 20px;text-align:center;box-shadow:0 8px 0 var(--shade);max-width:360px;width:100%}
.dialog b{font-size:24px;display:block;margin-bottom:14px}
.dialog .prow .pb{font-size:22px;min-width:110px;box-shadow:0 5px 0 var(--shade)}
.yes{background:#bff0dc!important}.no{background:#f4f6fa!important}

#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--sky)}
@media (max-width:560px){
  .fbtn{width:62px;height:62px;font-size:22px}
  .fbtn small{font-size:15px}
  .pb{height:52px;min-width:52px;font-size:24px}
  .badge .nm{font-size:15px;max-width:7.5em}
  .icon-btn{width:46px;height:46px;font-size:22px}
  #hint{font-size:14px}
}
/* touch controls (Roblox-style) */
#stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.3);border:4px solid rgba(255,255,255,.85);box-shadow:0 5px 0 var(--shade);touch-action:none}
#stick::after{content:'';position:absolute;inset:26px;border-radius:50%;border:3px dashed rgba(255,255,255,.7)}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--shade);z-index:1;pointer-events:none}
#jump{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;font-size:22px;font-weight:800;display:grid;place-items:center;line-height:1;touch-action:none}
#jump span{font-size:34px;display:block}
#ride{position:absolute;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sun);font-weight:800;font-size:22px;padding:12px 24px;white-space:nowrap;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
body.touch #ride{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.touch #hint{bottom:calc(178px + env(safe-area-inset-bottom,0px));font-size:15px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* Reachable, brushed-metal controls; safe areas protect iPhone home indicator. */
#panel,#callPanel{left:auto;right:calc(12px + env(safe-area-inset-right,0px));top:50%;bottom:auto;transform:translateY(-50%);width:196px;max-height:calc(100dvh - 140px);overflow:auto;box-sizing:border-box;background:linear-gradient(110deg,#b4bec9,#f0f3f5 45%,#a4afbd);color:#233246;border:3px solid #8793a2;border-radius:20px;padding:12px;box-shadow:0 8px 24px #172b4055;touch-action:pan-y}
#panel.in{animation:none}.ph{flex-wrap:wrap}.ph .display{width:100%;box-sizing:border-box}.ph .who span{color:#36465a}.ph .who b{font-size:16px}.chip{display:none}.floors{gap:12px}.fbtn{width:64px;height:64px;background:radial-gradient(circle at 35% 25%,#fff,#bac3cc);box-shadow:0 3px 0 #596574,inset 0 0 0 4px #eef1f4}.fbtn.go{color:#d42232;box-shadow:0 0 0 4px #ff424f,0 0 18px #ff424f88}.fbtn.here{background:#fff0bd}.fbtn small{font-size:16px}.pb{height:52px;min-width:52px}.pb.out{font-size:18px;width:100%}
#callPanel{position:absolute;width:168px;text-align:center}#callPanel h2{font-size:18px;line-height:1.1;margin:8px 0}#callPanel p{font-size:14px;line-height:1.2}#callButtons{display:flex;flex-direction:column;align-items:center;gap:16px}.call-button{width:76px;height:76px;border-radius:50%;font-size:34px;background:radial-gradient(circle at 35% 25%,white,#adb8c4);border:5px solid #e9edf2;box-shadow:0 3px 0 #627080}.call-button[aria-pressed=true]{color:#ed263b;border-color:#ff3449;box-shadow:0 0 20px #ff344988}.close-panel{min-width:44px;min-height:44px;float:right;font-size:24px}#callStatus{clear:both}#musicBtn{font-size:15px;width:76px}.mini{top:auto;bottom:12px;right:120px}body.touch .mini{display:none}#hint{pointer-events:none;font-size:14px;max-width:65vw;white-space:normal;text-align:center}
@media(max-width:600px){#panel{width:164px;padding:9px}.fbtn{width:58px;height:58px}.floors{gap:10px}#callPanel{width:144px}.hud{left:8px}.badge .nm{max-width:6em}#stick{width:112px;height:112px}#jump{width:72px;height:72px;font-size:18px}#toast{top:145px;font-size:16px}#hint,body.touch #hint{bottom:145px}.mini{display:none}}
@media(max-height:500px){#panel,#callPanel{max-height:calc(100dvh - 20px)}.mini,#hint{display:none!important}.ph .who{display:none}.hud .count{display:none}}

/* ---- v2: quieter UI, avatar builder, real elevator controls ---- */
#stick{background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);box-shadow:none}
#stick::after{display:none}
#stick svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#knob{background:rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.85);box-shadow:none}
#jump{background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.6);box-shadow:none;color:#fff}
#jump:active{background:rgba(255,255,255,.4);transform:none}
#jump svg{width:44%;height:44%}
#ride,#hint{display:none!important}
#act{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe89a,#ffb52e);border:4px solid #fff;box-shadow:0 5px 0 rgba(35,50,70,.3);font-size:42px;line-height:1;display:grid;place-items:center;animation:actpop .9s ease-in-out infinite;touch-action:none}
#act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(35,50,70,.3)}
@keyframes actpop{50%{transform:scale(1.06)}}
@media(max-width:600px){#act{width:80px;height:80px;font-size:36px;bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
.badge{padding:4px 12px 4px 5px}
.badge .nm{font-size:24px}
#musicBtn{width:52px;font-size:24px}
#callPanel{width:auto;padding:14px 12px}
#callRing{width:64px;height:10px;border-radius:6px;margin:0 auto 12px}
#callButtons{gap:14px}
#closeCall{display:none}
#panel .display{margin-bottom:4px;justify-content:center;width:100%;box-sizing:border-box}
#pFloors{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:12px}
#panel .prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
#panel .pb{font-size:20px;letter-spacing:-2px;width:100%;min-width:0;background:radial-gradient(circle at 35% 25%,#fff,#bac3cc);box-shadow:0 3px 0 #596574}
#panel .pb.alarm{background:radial-gradient(circle at 35% 25%,#ff8a80,#d4231c);color:#fff;font-size:24px;letter-spacing:0}
#panel .pb.alarm.on{animation:blink .3s steps(2) infinite}
#panel .pb.out{font-size:24px;letter-spacing:0}
.maps{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));width:min(900px,100%)}
.mapcard{padding:14px 10px 12px}
.mapcard .pic{font-size:54px}
.mapcard b{font-size:21px}
.mapcard.hospital{background:#d9f5ee}.mapcard.airport{background:#dcecff}
.avatar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,.88);border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 var(--shade);width:min(640px,100%);box-sizing:border-box}
#avatarView{width:170px;height:210px;border-radius:18px;background:linear-gradient(#cdeaff,#eaf6ff);touch-action:none;cursor:grab}
.opts{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 260px}
.orow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.orow .ico{font-size:24px;width:34px;text-align:center;flex:none}
.arw{width:44px;height:40px;border-radius:12px;background:#fff;box-shadow:0 4px 0 var(--shade);font-size:18px;font-weight:800}
.arw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:3px solid #fff;box-shadow:0 3px 0 var(--shade)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}

/* ---- v4: home screen + car wash ---- */
#home{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;box-sizing:border-box;touch-action:pan-y;
  background:radial-gradient(ellipse 60% 40% at 12% 18%,rgba(255,255,255,.75) 0 38%,transparent 39%),radial-gradient(ellipse 45% 30% at 88% 12%,rgba(255,255,255,.7) 0 38%,transparent 39%),linear-gradient(#7cc8ff,#bfe6ff 60%,#d9f5c9 60.2%,#a8e28f)}
#home h1{margin:0;font-weight:800;font-size:clamp(48px,11vw,96px);line-height:.95;text-align:center;color:#fff;text-shadow:0 4px 0 var(--tomato),0 8px 0 rgba(35,50,70,.25)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;width:min(620px,100%)}
.gamecard{border-radius:30px;padding:24px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 var(--shade);transition:transform .1s}
.gamecard:active{transform:translateY(6px);box-shadow:0 2px 0 var(--shade)}
.gamecard .pic{font-size:88px;line-height:1.05}
.gamecard b{font-size:30px}
#gElev{background:#ffe1d6}#gWash{background:#d6f0ff}
#startBack{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:2}
#washUI{position:absolute;inset:0;pointer-events:none}
#washUI > *{pointer-events:auto}
.wtop{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#wSteps{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;background:rgba(255,255,255,.88);border-radius:18px;padding:6px 8px;box-shadow:0 5px 0 var(--shade)}
#wSteps span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eef3f8;opacity:.45;transition:transform .2s}
#wSteps span.now{opacity:1;background:#ffe38a;transform:scale(1.15)}
#wSteps span.done{opacity:1;background:#bff0dc}
#wSelect,#wAct{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(720px,calc(100vw - 24px));box-sizing:border-box}
#wSelect{background:rgba(255,255,255,.9);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--shade)}
#wColors{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:260px}
#wColors .sw{width:40px;height:40px}
.warw{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--shade);font-size:26px;font-weight:800}
.wgo{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ff0c8,#22b573);color:#fff;font-size:40px;border:4px solid #fff;box-shadow:0 6px 0 rgba(35,50,70,.3)}
.wbtn{width:104px;height:104px;border-radius:50%;font-size:48px;border:5px solid #fff;box-shadow:0 7px 0 rgba(35,50,70,.3);background:radial-gradient(circle at 35% 30%,#bfe9ff,#2e9fe0);display:grid;place-items:center;animation:actpop 1s ease-in-out infinite}
.warw:active,.wgo:active,.wbtn:active{transform:translateY(4px)}
@media(max-width:600px){.wbtn{width:82px;height:82px;font-size:38px}.wgo{width:76px;height:76px;font-size:32px}.warw{width:52px;height:52px}#wSteps span{width:32px;height:32px;font-size:17px}#wSteps{gap:4px;padding:5px 6px}}

/* ---- v5: rockets ---- */
.games{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));width:min(820px,100%)}
#gRocket{background:#e2dcff}
#rocketUI{position:absolute;inset:0;pointer-events:none}
#rocketUI > *{pointer-events:auto}

function buildSlab(F) {
  const W = M.W, D = M.D, g = F.g, c = F.def.color;
  const holes = els.filter(e => e.def.side === 'center' && F.i >= e.minF && F.i <= e.maxF)
    .map(e => ({ x0: e.px - S / 2, x1: e.px + S / 2, z0: e.pz - S / 2, z1: e.pz + S / 2 }));
  const piece = (x0, x1, z0, z1) => {
    if (x1 - x0 < .01 || z1 - z0 < .01) return;
    const m = mesh(boxGeo(x1 - x0, SLAB, z1 - z0), mat(c), g, (x0 + x1) / 2, -SLAB / 2, (z0 + z1) / 2);
    m.userData.floor = true; m.castShadow = false;
  };
  if (!holes.length) piece(-W / 2, W / 2, -D / 2, D / 2);
  else {
    const h = holes[0];
    piece(-W / 2, h.x0, -D / 2, D / 2); piece(h.x1, W / 2, -D / 2, D / 2);
    piece(h.x0, h.x1, -D / 2, h.z0); piece(h.x0, h.x1, h.z1, D / 2);
  }
  // tile pattern: soft checker squares (visual only)
  const tileM = mat(mix(c, 0xffffff, .28));
  for (let x = -W / 2 + 2; x < W / 2 - 1; x += 4) for (let z = -D / 2 + 2; z < D / 2 - 1; z += 4) {
    if (((x + z) / 2 | 0) % 2 === 0) continue;
    if (holes.some(h => x > h.x0 - 1.5 && x < h.x1 + 1.5 && z > h.z0 - 1.5 && z < h.z1 + 1.5)) continue;
    const t = mesh(boxGeo(1.9, .02, 1.9), tileM, g, x, .005, z); t.castShadow = false; t.userData.floor = true;
  }
  // slab edge band (the building's "floor line")
  const band = mesh(boxGeo(W + .3, .5, .3), mat(darken(F.def.wall, .1)), g, 0, -SLAB - .25 + .1, D / 2 + .15);
  band.castShadow = false;
}

function lowWalls(F) {
  const W = M.W, D = M.D, i = F.i, g = F.g, c = F.def.wall, cap = lighten(c, .45);
  const open = { back: [], left: [], right: [] };
  M.elevators.forEach(d => { if (d.side !== 'center' && d.stops.includes(i)) open[d.side].push(d.at); });
  if (M.gaps) for (const sd in M.gaps) open[sd].push(...M.gaps[sd]);
  const gap = DOOR_W + .3;
  const run = (from, to, ops, place) => {
    ops.sort((a, b) => a - b); let s = from;
    for (const o of ops) { const a = o - gap / 2; if (a > s + .01) place(s, a); s = o + gap / 2; }
    if (to > s + .01) place(s, to);
  };
  run(-W / 2, W / 2, open.back, (a, b) => {
    mesh(boxGeo(b - a, LOW, .3), mat(c), g, (a + b) / 2, LOW / 2, -D / 2 + .15);
    mesh(boxGeo(b - a, .14, .44), mat(cap), g, (a + b) / 2, LOW + .07, -D / 2 + .15);
  });
  [['left', -1], ['right', 1]].forEach(([side, sx]) => run(-D / 2, D / 2, open[side], (a, b) => {
    mesh(boxGeo(.3, LOW, b - a), mat(c), g, sx * (W / 2 - .15), LOW / 2, (a + b) / 2);
    mesh(boxGeo(.44, .14, b - a), mat(cap), g, sx * (W / 2 - .15), LOW + .07, (a + b) / 2);
  }));
  if (i > 0) { // front railing on upper floors
    mesh(boxGeo(W, .12, .12), mat(cap), g, 0, 1.05, D / 2 - .12);
    for (let x = -W / 2 + .3; x <= W / 2 - .2; x += 2) mesh(boxGeo(.1, 1.05, .1), mat(cap), g, x, .52, D / 2 - .12);
  }
}

}

function updateElevator(e, dt, t) {

    const s = dt * 1.5;
    e.door = e.doorTarget > e.door ? Math.min(1, e.door + s) : Math.max(0, e.door - s);
    if (e.door === e.doorTarget) { const cb = e.doorCb; e.doorCb = null; cb && cb(); }

    e.idle -= dt;

}

  if (mode === 'rocket') { if (KEYMAP[ev.code]) { keys[KEYMAP[ev.code]] = true; ev.preventDefault(); } else if (ev.code === 'Space') { rJump(); ev.preventDefault(); } else if (ev.code === 'KeyE' || ev.code === 'Enter') rAction(); return; }
  if (!running) return;
  if (KEYMAP[ev.code]) { if(P.state==='using')leaveItem(); keys[KEYMAP[ev.code]] = true; ev.preventDefault(); }
  else if (ev.code === 'Space') { doJump(); ev.preventDefault(); }
  else if (ev.code === 'KeyE' || ev.code === 'Enter') actNow();
});

/* ---------- confetti ---------- */
function burstConfetti() {
  const cs = [0xff6150, 0xffc93c, 0x2e9fe0, 0x2fbf8f, 0xa56cf0, 0xff8fc4];
  for (let n = 0; n < 90; n++) {
    const m = mesh(boxGeo(.18, .18, .05), new THREE.MeshBasicMaterial({ color: cs[n % 6], side: THREE.DoubleSide }), scene, P.x, P.y + 3, P.z);
    m.castShadow = false;
    m.userData = { vx: (Math.random() - .5) * 8, vy: 6 + Math.random() * 6, vz: (Math.random() - .5) * 8, life: 3 };
    confetti.push(m);
  }
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmpV = new THREE.Vector3();
let hoverEl = false;

function updatePlayer(dt) {
  let moving = false;
  if (P.script) {
    const s = P.script, dx = s.x - P.x, dz = s.z - P.z, d = Math.hypot(dx, dz), step = s.speed * dt;
    if (d <= step) { P.x = s.x; P.z = s.z; P.script = null; s.done && s.done(); }
    else { P.x += dx / d * step; P.z += dz / d * step; P.yaw = Math.atan2(dx, dz); moving = true; }
  } else if (P.state === 'free' || P.state === 'toElevator') {
    // stick or keyboard: x = right, y = forward (away from the camera)
    let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), iy = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    if (joy.active && joy.mag > .15) { ix = joy.x; iy = joy.y; }
    const il = Math.hypot(ix, iy);
    if (il > .01) {
      if (P.state === 'toElevator') cancelCall();
      P.pendingItem=null;P.route=[]; P.walkTarget = null; marker.material.opacity = 0;
      const mag = Math.min(1, il), nx = ix / il, ny = iy / il;
      const c = Math.cos(camYaw), s = Math.sin(camYaw);
      const wx = nx * c - ny * s, wz = -nx * s - ny * c;
      const sp = SPEED * (P.swim > .5 ? .6 : 1);
      tryMove(wx * sp * mag * dt, wz * sp * mag * dt);
      const want = Math.atan2(wx, wz); let da = want - P.yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); P.yaw += da * Math.min(1, dt * 16);
      moving = true;
    } else if (P.walkTarget) {
      const tg = P.walkTarget, dx = tg.x - P.x, dz = tg.z - P.z, d = Math.hypot(dx, dz);
      if (d < .12) {
        P.walkTarget = P.route && P.route.shift();
        if(!P.walkTarget){if (P.state === 'toElevator') arrivedAtElevator();else beginItem();}
      } else {
        const step = Math.min(d, SPEED * (P.swim > .5 ? .6 : 1) * dt);
        const before = P.x + P.z * 1000;
        tryMove(dx / d * step, dz / d * step);
        const after = P.x + P.z * 1000;
        const want = Math.atan2(dx, dz);
        let da = want - P.yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); P.yaw += da * Math.min(1, dt * 14);
        moving = true;
        if (Math.abs(after - before) < 1e-4) {
          P.stuck += dt;
          if (P.stuck > .35) {
            P.walkTarget = null; P.stuck = 0; moving = false;
            if (P.state === 'toElevator') cancelCall();
            P.route=[];P.pendingItem=null;
          }
        } else P.stuck = 0;
      }
    }
  }
  // height
  if (P.el && ['boarding', 'inside', 'riding', 'exiting'].includes(P.state)) P.y = P.el.y;
  else P.y = P.floor * H;
  if (P.jv !== 0 || P.jy > 0) { P.jv -= 26 * dt; P.jy += P.jv * dt; if (P.jy <= 0) { P.jy = 0; P.jv = 0; } }
  const freeish = P.state === 'free' || P.state === 'toElevator';
  if (!freeish) { P.jy = 0; P.jv = 0; }
  const FL = floors[P.floor];
  const pool = freeish ? poolAt(FL, P.x, P.z) : null, inWater = !!pool;
  if (pool) { P.sink = pool.sink || 1.75; P.wy = pool.wy || .34; }
  if (inWater && P.swim < .05 && P.jy < .3) { SFX.splash(); ripple(P.x, P.floor * H + P.wy, P.z, true); }
  P.swim += ((inWater ? 1 : 0) - P.swim) * Math.min(1, dt * 7);
  P.y -= P.sink * P.swim;
  if (P.state === 'using' && P.item && P.item.kind === 'ride') {
    const r = P.item.ride, th = r.spin.rotation.y, hx = Math.cos(r.a) * 2.2, hz = Math.sin(r.a) * 2.2;
    P.x = r.cx + hx * Math.cos(th) + hz * Math.sin(th); P.z = r.cz - hx * Math.sin(th) + hz * Math.cos(th);
    P.yaw = th - r.a; P.rideY = r.horse.position.y + .3;
  }
  if (P.biteT > 0) P.biteT -= dt;
  if (P.hold && P.hold.table) { P.autoBite += dt; if (P.autoBite > 2.2) { P.autoBite = 0; bite(); } }
  if (P.state === 'using' && P.item && P.item.kind === 'drink') { P.useT += dt; if (P.useT > 2.6) leaveItem(); }

  // balloons
  if (P.state === 'free' || P.state === 'toElevator') {
    floors[P.floor].balloons.forEach(b => {
      if (b.popped || Math.hypot(b.x - P.x, b.z - P.z) > 1.1) return;
      b.popped = true; b.popT = .25; popped++; updateCount(); SFX.pop();
      if (popped === totalBalloons) { setTimeout(() => { SFX.yay(); burstConfetti(); toast('🎉 🎈 🎉', 4000, true); }, 250); }
    });
  }

  // animate avatar
  const pl = player;
  pl.g.position.set(P.x, P.y + (P.jy || 0), P.z);
  let da = P.yaw - pl.g.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da)); pl.g.rotation.y += da * Math.min(1, dt * 16);
  if (moving) {
    P.phase += dt * 11;
    P.stepT += dt; if (P.stepT > .3) { P.stepT = 0; if (P.swim > .5) { noise(.25, { vol: .05, freq: 700, type: 'lowpass' }); ripple(P.x, P.floor * H + P.wy, P.z, false); } else SFX.step(); }
  } else P.phase *= .8;
  const sw = moving ? Math.sin(P.phase) * .7 : 0;
  pl.legs[0].rotation.x = sw; pl.legs[1].rotation.x = -sw;
  pl.arms[0].rotation.x = -sw * .9; pl.arms[1].rotation.x = sw * .9;
  const wave = P.state === 'inside' ? Math.max(0, Math.sin(performance.now() / 400)) : 0;
  pl.arms[1].rotation.z = P.state === 'inside' ? 2.6 + wave * .35 : 0;
  pl.arms[1].position.y = 1.88;
  if (P.swim > .5 && P.sink > 1) {
    P.phase += dt * (moving ? 0 : 5);
    pl.arms[0].rotation.x = -(P.phase * .8) % (Math.PI * 2); pl.arms[1].rotation.x = -(P.phase * .8 + Math.PI) % (Math.PI * 2);
    pl.arms[1].rotation.z = 0; pl.legs[0].rotation.x = Math.sin(P.phase * 2) * .4; pl.legs[1].rotation.x = -Math.sin(P.phase * 2) * .4;
  }
  pl.g.rotation.x = 0; pl.head.rotation.x = 0; pl.legs[0].rotation.z = 0; pl.legs[1].rotation.z = 0;
  pl.heldCup.visible = P.state === 'using' && P.item && P.item.kind === 'drink';
  if (P.hold && P.state !== 'inside' && P.swim < .5) { pl.arms[1].rotation.x = P.hold.food ? -.55 : -.15; pl.arms[1].rotation.z = 0; }
  if (P.state === 'using' && P.item) {
    const item = P.item;
    if (item.kind === 'sleep') { pl.g.rotation.x = -Math.PI / 2; pl.g.position.y = P.floor * H + item.height; }
    if (item.kind === 'sit' || item.kind === 'eat') { pl.g.position.y = P.floor * H + item.height - .95; pl.legs.forEach(l => l.rotation.x = -Math.PI / 2); }
    if (item.kind === 'ride') { pl.g.position.y = P.floor * H + P.rideY - .7; pl.legs[0].rotation.x = -1.3; pl.legs[1].rotation.x = -1.3; pl.legs[0].rotation.z = .45; pl.legs[1].rotation.z = -.45; pl.arms[0].rotation.x = -1.1; }
    if (item.kind === 'drink') { pl.arms[1].rotation.x = -2.3; pl.arms[1].rotation.z = -.25; }
    if (item.kind === 'look') { pl.arms[0].rotation.x = -1.7; pl.arms[1].rotation.x = -1.7; pl.head.rotation.x = -.25; }
  }
  if (P.biteT > 0) { const u = 1 - P.biteT / .6; pl.arms[1].rotation.x = -2.25 * Math.sin(u * Math.PI) - .35; pl.arms[1].rotation.z = -.2; }

}

function updateVisibility() {
  const ridingLike = P.el && ['boarding', 'inside', 'riding', 'exiting'].includes(P.state);
  vf = ridingLike ? Math.max(0, Math.min(floors.length - 1, Math.floor(P.el.y / H + .05))) : P.floor;
  const riding = P.state === 'riding';
  floors.forEach(F => { F.g.visible = F.i <= vf; });
  towerSegs.forEach(s => { s.g.visible = true; });
  els.forEach(e => { e.cab.visible = true; });
  if (vf !== shownVf) {
    shownVf = vf;
    const fd = M.floors[vf];
    $('#fNum').textContent = fd.short;
    $('#fName').textContent = fd.emoji;
    $('#miniFloor').textContent = fd.emoji;
  }
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!scene) return;
  if (mode === 'wash' && W.scene) { updateWash(dt, t); updateMusic(); renderer.render(W.scene, W.cam); return; }
  if (mode === 'rocket' && RK.scene) { updateRocket(dt, t); updateMusic(); if (RK.active === 'space') renderer.render(RK.sp.scene, RK.sp.cam); else renderer.render(RK.scene, RK.cam); return; }
  if (running) {
    els.forEach(e => updateElevator(e, dt, t));
    updateWalkers(dt, t);
    updatePlayer(dt);
    updateVisibility();
    updatePanel();
    updateRidePrompt();
    const inPanel = !$('#panel').hidden;
    if (TOUCH || innerWidth < 900) { $('#stick').hidden = inPanel; $('#jump').hidden = inPanel; }
  }
  updateMusic();
  // shake unserved elevator
  towerSegs.forEach(s => {
    const e = s.e;
    if (e.shake > 0) { s.g.position.x = s.bx + Math.sin(t * 70) * .08 * (e.shake / .45); }
    else if (s.g.position.x !== s.bx) s.g.position.x = s.bx;
  });
  els.forEach(e => { if (e.shake > 0) e.shake = Math.max(0, e.shake - dt); });
  // floor anims + balloons
  floors.forEach(F => {
    if (!F.g.visible) return;
    F.anims.forEach(fn => fn(t));
    F.balloons.forEach(b => {
      if (b.popped) {
        if (b.popT > 0) { b.popT -= dt; const s = 1 + (0.25 - b.popT) * 6; b.grp.scale.set(s, s, s); if (b.popT <= 0) b.grp.visible = false; }
        return;
      }
      b.grp.position.y = Math.sin(t * 1.6 + b.ph) * .15; b.grp.rotation.y = Math.sin(t * .7 + b.ph) * .3;
    });
  });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 90) c.position.x = -90; });
  worldAnims.forEach(fn => fn(t, dt));
  updateSky(dt);
  updateAct();
  for (let n = ripples.length - 1; n >= 0; n--) { const m = ripples[n]; m.userData.life -= dt; m.scale.multiplyScalar(1 + dt * 2.2); m.material.opacity = Math.max(0, m.userData.life); if (m.userData.life <= 0) { scene.remove(m); ripples.splice(n, 1); } }
  if (!$('#start').hidden) renderPreview(dt, t);
  if (marker && marker.material.opacity > 0) { marker.material.opacity = Math.max(0, marker.material.opacity - dt * .9); marker.scale.multiplyScalar(1 + dt * .6); }
  for (let n = confetti.length - 1; n >= 0; n--) {
    const m = confetti[n], u = m.userData;
    u.vy -= 12 * dt; m.position.x += u.vx * dt; m.position.y += u.vy * dt; m.position.z += u.vz * dt;
    m.rotation.x += dt * 8; m.rotation.y += dt * 6; u.life -= dt;
    if (u.life <= 0) { scene.remove(m); confetti.splice(n, 1); }
  }
  // camera
  const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  const zf = zoom * (aspect < .8 ? 1.5 : aspect < 1.2 ? 1.2 : 1);
  const panelOpen = !$('#panel').hidden;
  const tgtX = P ? P.x : 0, tgtY = P ? P.y : 0, tgtZ = P ? P.z : 0;
  tmpV.set(tgtX + Math.sin(camYaw) * 23 * zf, tgtY + 7 + 14 * zf, tgtZ + Math.cos(camYaw) * 23 * zf);
  if(overview){const distance=Math.max(M.W+S*2,45)/Math.min(1,aspect);tmpV.set(Math.sin(camYaw)*distance, M.floors.length*H/2+distance*.55,Math.cos(camYaw)*distance);}
  camPos.lerp(tmpV, Math.min(1, dt * 3.2));
  if(overview) tmpV.set(0,M.floors.length*H/2,0);
  else tmpV.set(tgtX + (panelOpen ? 3 * zf : 0), tgtY + 5, tgtZ);
  camLook.lerp(tmpV,Math.min(1,dt*3.2));
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (dirLight) { dirLight.position.set(camLook.x + 14, camLook.y + 30, camLook.z + 10); dirLight.target.position.set(camLook.x, camLook.y, camLook.z); }
  // hover cursor
  if (hoverQ && running) { const p = pick(hoverQ.x, hoverQ.y); const on = p && (p.type === 'el' || p.type === 'item'); if (on !== hoverEl) { hoverEl = on; canvas.style.cursor = on ? 'pointer' : 'default'; } hoverQ = null; }
  if (running) drawMini(t);
  renderer.render(scene, camera);
}

function ripple(x, y, z, big) {
  const m = new THREE.Mesh(new THREE.RingGeometry(.3, .45, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.userData.life = big ? 1 : .7; scene.add(m); ripples.push(m);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (M) setupMini();
  if(running)setTouchUI(true);
  if (W.cam) { W.cam.aspect = w / h; W.cam.updateProjectionMatrix(); }
  if (RK.cam) { RK.cam.aspect = w / h; RK.cam.updateProjectionMatrix(); }
  if (RK.sp) { RK.sp.cam.aspect = w / h; RK.sp.cam.updateProjectionMatrix(); }
}

  refreshPreview();
}
function refreshPreview() {
  if (!pv.scene) return;
  if (pv.model) pv.scene.remove(pv.model.g);
  pv.model = makePlayer(look); pv.scene.add(pv.model.g);
  try { localStorage.setItem('etLook', JSON.stringify(look)); } catch (e) {}
  document.querySelectorAll('.sws').forEach(w => w.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.c === look[w.dataset.k]))));
}
function renderPreview(dt, t) {
  if (!pv.r || !pv.model) return;
  if (pv.drag === null) pv.yaw += dt * .6;
  pv.model.g.rotation.y = pv.yaw; pv.model.arms[1].rotation.z = Math.max(0, Math.sin(t * 2)) * .7;
  pv.r.render(pv.scene, pv.cam);
}
document.querySelectorAll('.sws').forEach(w => {
  const k = w.dataset.k;
  LOOKS[k].forEach(c => {
    const b = document.createElement('button'); b.className = 'sw'; b.style.background = css(c); b.dataset.c = c;
    b.setAttribute('aria-label', 'color'); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { audio(); look[k] = c; tone(660 + Math.random() * 300, .1, { type: 'triangle', vol: .07 }); refreshPreview(); });
    w.appendChild(b);
  });
});
document.querySelectorAll('.arw').forEach(b => b.addEventListener('click', () => {
  audio(); const k = b.dataset.k, list = LOOKS[k];
  look[k] = list[(list.indexOf(look[k]) + +b.dataset.d + list.length) % list.length];
  tone(520, .1, { type: 'triangle', vol: .07 }); refreshPreview();
}));
setupPreview();
$('#homeBtn').addEventListener('click', () => { $('#confirm').hidden = false; });
$('#cNo').addEventListener('click', () => { $('#confirm').hidden = true; });
$('#cYes').addEventListener('click', () => {
  $('#confirm').hidden = true; running = false; humStop(); cancelCall(); hidePanel(); updateMusic();
  $('#hud').hidden = true; $('#miniWrap').hidden = true; $('#hint').hidden = true; $('#toast').hidden = true;
  setTouchUI(false); $('#ride').hidden = true; joy.active = false;
  $('#start').hidden = false;
});
$('#soundBtn').addEventListener('click', () => {
  muted = !muted; $('#soundBtn').textContent = muted ? '🔇' : '🔊';
  if(master) master.gain.setTargetAtTime(muted?0:.8,AC.currentTime,.03);
  if (muted) humStop(); else { audio(); SFX.beep(); }
});

if (TOUCH) document.body.classList.add('touch');
// idle backdrop behind the start screen
buildMap('hotel');
resize();
running = false;
loop();
if (document.fonts && document.fonts.load) document.fonts.load('800 40px "Baloo 2"').then(() => { if (!running) { buildMap('hotel'); } }).catch(() => {});
})();
</script>
